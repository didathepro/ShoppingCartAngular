<section class="flex flex-col items-center pt-5 bg-[#8ec5ff] h-screen w-[18vw]">
    <h1 class="text-3xl font-bold mb-8">Basket</h1>

    <div class="flex bg-gray-500 w-[15vw] rounded-full p-1">
        <button id="delivery" class="flex-1 text-white me-2 hover:bg-blue-500 hover:cursor-pointer hover:rounded-full py-2"
        (click)="selectDelivery()" [class.bg-blue-500.rounded-full]="selectedOption() === 'delivery'" [class.rounded-full]="selectedOption() === 'delivery'">
            Delivery
        </button>

        <button id="collection" class="flex-1 text-white hover:bg-blue-500 hover:cursor-pointer hover:rounded-full py-2"
        (click)="selectCollection()" [class.bg-blue-500.rounded-full]="selectedOption() === 'collection'" [class.rounded-full]="selectedOption() === 'collection'">
            Collection
        </button>
    </div>
</section>
